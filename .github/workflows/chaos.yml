name: Chaos Tests

on:
  push:
    branches: [main]

jobs:
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Set up Docker Compose cluster
        run: docker compose up -d --build
      - name: Wait for cluster
        run: sleep 10
      - name: Install Toxiproxy
        run: |
          wget -qO /usr/local/bin/toxiproxy-server \
            https://github.com/Shopify/toxiproxy/releases/download/v2.9.0/toxiproxy-server-linux-amd64
          chmod +x /usr/local/bin/toxiproxy-server
          toxiproxy-server &
          sleep 2
      - name: Run chaos tests
        run: go test -tags chaos -v -timeout 120s ./chaos/toxiproxy/...
      - name: Tear down
        if: always()
        run: docker compose down -v
